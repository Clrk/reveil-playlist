name: NewPipe

# Every morning: checks that YouTube still works with the current NewPipeExtractor, and proposes
# its latest release when there is one. A new release that passes the tests opens a pull request,
# never merged automatically: it is published once someone has reviewed and merged it.
# Anything that fails opens an issue instead.
# YouTube sometimes asks GitHub's servers to sign in ("confirm you're not a bot") because they are
# datacenter machines: phones are not concerned, so that answer is "unknown", not "broken". Then no
# issue is opened, and a new NewPipeExtractor is still proposed once the project tests pass:
# keeping NewPipe up to date is the real repair.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  GH_TOKEN: ${{ github.token }}

jobs:
  newpipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Versions
        id: versions
        run: |
          current=$(sed -n 's/.*NewPipeExtractor:\(v[^"]*\)".*/\1/p' reveil-youtube/build.gradle.kts)
          latest=$(gh api repos/TeamNewPipe/NewPipeExtractor/releases/latest --jq .tag_name)
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - name: Move to the latest NewPipeExtractor
        if: steps.versions.outputs.latest != steps.versions.outputs.current
        run: |
          sed -i "s/NewPipeExtractor:${{ steps.versions.outputs.current }}/NewPipeExtractor:${{ steps.versions.outputs.latest }}/" reveil-youtube/build.gradle.kts
      - name: YouTube still works
        id: smoke
        run: |
          if ./gradlew --no-daemon :reveil-youtube:test --tests '*YouTubeSmokeTest*' -Psmoke; then
            echo "result=ok" >> "$GITHUB_OUTPUT"
          elif grep -rqs SignInConfirmNotBotException reveil-youtube/build/test-results/test; then
            echo "result=bot-check" >> "$GITHUB_OUTPUT"
            echo "::warning::YouTube a demandé aux serveurs GitHub de prouver qu'ils ne sont pas des robots : test impossible aujourd'hui (les téléphones ne sont pas concernés)."
          else
            exit 1
          fi
      - name: Tests
        if: steps.versions.outputs.latest != steps.versions.outputs.current
        run: ./gradlew --no-daemon gate :app:assembleRelease
      - name: Propose the update for review
        if: steps.versions.outputs.latest != steps.versions.outputs.current
        env:
          SMOKE: ${{ steps.smoke.outputs.result }}
        run: |
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          next="${name%.*}.$(( ${name##*.} + 1 ))"
          sed -i "s/versionCode = $code/versionCode = $((code + 1))/; s/versionName = \"$name\"/versionName = \"$next\"/" app/build.gradle.kts
          branch="newpipe/${{ steps.versions.outputs.latest }}"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "La pull request pour ${{ steps.versions.outputs.latest }} attend déjà d'être relue."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "NewPipeExtractor ${{ steps.versions.outputs.latest }} (version $next)"
          git push -u origin "$branch"
          body="Proposition automatique : YouTube fonctionne avec la nouvelle version (test réel + tests du projet verts)."
          if [ "$SMOKE" = "bot-check" ]; then
            body="Proposition automatique : tests du projet verts. YouTube a refusé de répondre aux serveurs GitHub (vérification « robot »), les téléphones ne sont pas concernés."
          fi
          body="$body À relire avant de fusionner : la fusion publie la version $next, que les téléphones proposeront."
          gh pr create --base main --head "$branch" --title "NewPipeExtractor ${{ steps.versions.outputs.latest }}" --body "$body"
          # A pull request opened with this workflow's token does not start check.yml by itself.
          gh workflow run check.yml --ref "$branch"
      - name: Close the warning
        if: steps.smoke.outputs.result == 'ok'
        run: |
          for number in $(gh issue list --state open --search "YouTube ne fonctionne plus in:title" --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Le test quotidien repasse : YouTube fonctionne de nouveau."
          done
      - name: Warn
        if: failure()
        run: |
          title="YouTube ne fonctionne plus avec NewPipeExtractor ${{ steps.versions.outputs.latest }}"
          if [ -z "$(gh issue list --state open --search "$title in:title" --json number --jq '.[].number')" ]; then
            gh issue create --title "$title" --body "Le test quotidien a échoué : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Le réveil sonne quand même avec la sonnerie de secours, et l'app prévient l'utilisateur."
          fi
