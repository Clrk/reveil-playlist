name: Release

# Pushing a tag such as v0.9.8 builds the APK, signs it with the app's key and publishes it
# as a GitHub release: the app looks there for its updates.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Sign
        env:
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE" | base64 -d > reveil.jks
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" sign --ks reveil.jks --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
            --out "reveil-playlist-${GITHUB_REF_NAME#v}.apk" app/build/outputs/apk/release/app-release.apk
          rm reveil.jks
      - uses: softprops/action-gh-release@v2
        with:
          files: reveil-playlist-*.apk
          generate_release_notes: true
